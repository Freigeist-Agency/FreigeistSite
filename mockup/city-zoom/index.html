<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>city zoom (mockup) · freigeist agency</title>
  <link rel="icon" href="../../images/favicon.png">
  <link rel="stylesheet" href="city-zoom.css">
</head>
<body>
  <!-- Clickable mockup of the city zoom (design: city-zoom-design.md, 2026-11-23). Pick a city with
       "nbo" / "cgn" or by clicking its dot: the globe spins to it, zooms into the country, the dots
       turn dense, then split: some build the project tiles, the rest spell the city's name, which
       turns into the real heading. Back (button or browser) plays it in reverse.
       Not wired into /globe's scroll story yet; placeholder projects, day mode only. -->
  <main class="cz" data-state="globe">
    <section class="cz-locations" aria-label="locations">
      <h2 class="cz-word">locations.</h2>
      <canvas class="cz-globe" aria-hidden="true"></canvas>
      <div class="cz-places">
        <button type="button" class="cz-place" data-city="remote">remote</button>
        <button type="button" class="cz-place" data-city="nairobi">nbo</button>
        <button type="button" class="cz-place" data-city="cologne">cgn</button>
      </div>
      <p class="cz-hint">mockup: pick nbo / cgn, or click a city's dot on the globe</p>
    </section>

    <!-- the dense country dots, then the dots flying into the tiles and the name -->
    <canvas class="cz-dots" aria-hidden="true"></canvas>

    <section class="cz-work" aria-live="polite" hidden>
      <h1 class="cz-title" tabindex="-1"></h1>
      <button type="button" class="cz-back">back to locations</button>
      <ul class="cz-tiles"></ul>
    </section>
  </main>

  <script src="../../js/vendor/gsap/3.15.0/gsap.min.js"></script>
  <script type="module" src="city-zoom.js"></script>
</body>
</html>
